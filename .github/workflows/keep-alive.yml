name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 14 minutes (Render free tier sleeps after 15 minutes of inactivity)
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          TARGET_URL="${{ secrets.RENDER_BACKEND_URL }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://travel-agency-kdrs.onrender.com"
          fi
          echo "Pinging $TARGET_URL/api/v1/health..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$TARGET_URL/api/v1/health" || true)
          echo "Received backend status code: $STATUS"

      - name: Ping Frontend Keep-Alive
        run: |
          echo "Pinging https://kv-tours-travels.vercel.app/api/keep-alive..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://kv-tours-travels.vercel.app/api/keep-alive" || true)
          echo "Received frontend status code: $STATUS"

